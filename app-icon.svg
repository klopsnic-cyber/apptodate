<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- AppToDate: Kalenderblatt („Date") mit Pfeil nach oben („Up") = up to date -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fc8c6"/>
      <stop offset="0.55" stop-color="#4a6cf7"/>
      <stop offset="1" stop-color="#6a3df0"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#e8414a"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4a6cf7"/>
      <stop offset="1" stop-color="#1fc8c6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1060" flood-opacity="0.35"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b1060" flood-opacity="0.3"/>
    </filter>
    <clipPath id="page"><rect x="232" y="252" width="560" height="560" rx="72"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#sh)"/>
  <!-- Kalenderblatt -->
  <g filter="url(#sh2)">
    <rect x="232" y="252" width="560" height="560" rx="72" fill="#ffffff"/>
  </g>
  <g clip-path="url(#page)">
    <rect x="232" y="252" width="560" height="150" fill="url(#head)"/>
  </g>
  <!-- Ringe -->
  <g fill="#ffffff" stroke="#2b2f6b" stroke-width="0">
    <rect x="352" y="206" width="40" height="110" rx="20" fill="#eef1ff"/>
    <rect x="632" y="206" width="40" height="110" rx="20" fill="#eef1ff"/>
  </g>
  <!-- Pfeil nach oben -->
  <path d="M512 452 L652 600 L566 600 L566 744 L458 744 L458 600 L372 600 Z" fill="url(#arrow)" stroke="url(#arrow)" stroke-width="18" stroke-linejoin="round"/>
</svg>
