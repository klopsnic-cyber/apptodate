[package]
name = "update-radar"
version = "0.1.0"
description = "Update-Radar: prüft Programme auf dem Mac und schiebt Updates an"
authors = ["infralatis"]
license = "MIT"
edition = "2024"

[lib]
name = "update_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
ureq = "2"
roxmltree = "0.20"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
